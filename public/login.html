<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Habibi API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="glass w-full max-w-md p-8 rounded-2xl">
    <a href="/" class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
      ⚡ Habibi API
    </a>
    <h1 class="text-2xl font-bold mt-4 mb-1">Login</h1>
    <p class="text-sm text-slate-400 mb-6">Masuk ke dashboard.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">Username</label>
        <input class="input w-full px-3 py-2 rounded-lg" name="username" required />
      </div>
      <div>
        <label class="block text-sm mb-1">Password</label>
        <input class="input w-full px-3 py-2 rounded-lg" name="password" type="password" required />
      </div>
      <button type="submit" id="submitBtn" class="btn w-full px-4 py-2.5 rounded-lg font-medium text-white">
        Login
      </button>
    </form>

    <p class="text-sm text-center text-slate-400 mt-4">
      Belum punya akun? <a href="/register.html" class="text-indigo-400 hover:text-indigo-300">Daftar</a>
    </p>
  </div>

  <script type="module">
    import { api, toast, redirectIfLoggedIn } from "/js/app.js";
    redirectIfLoggedIn();

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("submitBtn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Loading...";
      const fd = new FormData(form);
      try {
        const r = await api.post("/api/auth/login", {
          username: fd.get("username"),
          password: fd.get("password"),
        });
        api.setToken(r.result.token);
        toast("Login sukses!", "success");
        setTimeout(() => (location.href = "/dashboard.html"), 800);
      } catch (err) {
        toast(err.message, "error");
        btn.disabled = false; btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
