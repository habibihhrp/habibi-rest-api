<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Habibi API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="glass sticky top-0 z-40 border-b border-slate-700/50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
        ⚡ Habibi API
      </a>
      <div class="flex gap-2 items-center">
        <a href="/dashboard.html" class="px-3 py-2 text-sm text-slate-300 hover:text-white">Dashboard</a>
        <a href="/admin.html" class="px-3 py-2 text-sm text-amber-400">Admin</a>
        <button id="logoutBtn" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium text-white">Logout</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Admin Panel</h1>

    <div class="glass rounded-xl p-6">
      <h2 class="font-bold text-lg mb-3">Users (max 200)</h2>
      <div id="loading" class="text-slate-400">Loading...</div>
      <div id="error" class="hidden text-red-400"></div>
      <div class="overflow-x-auto">
        <table id="usersTable" class="hidden w-full text-sm">
          <thead class="text-left text-slate-400 border-b border-slate-700">
            <tr>
              <th class="py-2">ID</th>
              <th class="py-2">Username</th>
              <th class="py-2">Email</th>
              <th class="py-2">Role</th>
              <th class="py-2">Plan</th>
              <th class="py-2">Used</th>
              <th class="py-2">Action</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, toast, requireLogin } from "/js/app.js";
    if (!requireLogin()) throw new Error("redirected");

    const $ = (id) => document.getElementById(id);

    const load = async () => {
      try {
        const r = await api.get("/api/admin/users");
        const list = r.result;
        const tbody = $("usersBody");
        tbody.innerHTML = "";
        for (const u of list) {
          const tr = document.createElement("tr");
          tr.className = "border-b border-slate-800";
          tr.innerHTML = `
            <td class="py-2">${u.id}</td>
            <td class="py-2 font-medium">${u.username}</td>
            <td class="py-2 text-slate-400">${u.email}</td>
            <td class="py-2">
              <span class="${u.role === 'admin' ? 'text-amber-400' : 'text-slate-400'}">${u.role}</span>
            </td>
            <td class="py-2">
              <span class="${u.plan === 'premium' ? 'text-emerald-400' : 'text-slate-400'}">${u.plan || '-'}</span>
            </td>
            <td class="py-2">${u.used_today}</td>
            <td class="py-2">
              <button data-uid="${u.id}" data-plan="${u.plan === 'premium' ? 'free' : 'premium'}" class="upgrade-btn btn-secondary px-2 py-1 rounded text-xs">
                ${u.plan === 'premium' ? '↓ Free' : '★ Premium 30d'}
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        }
        $("loading").classList.add("hidden");
        $("usersTable").classList.remove("hidden");

        for (const btn of document.querySelectorAll(".upgrade-btn")) {
          btn.addEventListener("click", async () => {
            const uid = btn.dataset.uid;
            const plan = btn.dataset.plan;
            const days = plan === "premium" ? 30 : null;
            try {
              await api.post("/api/admin/upgrade", { user_id: Number(uid), plan, days });
              toast(`User ${uid} → ${plan}`, "success");
              setTimeout(load, 500);
            } catch (e) {
              toast(e.message, "error");
            }
          });
        }
      } catch (e) {
        $("loading").classList.add("hidden");
        $("error").classList.remove("hidden");
        $("error").textContent = e.message;
      }
    };

    $("logoutBtn").addEventListener("click", () => {
      api.clearToken();
      location.href = "/";
    });

    load();
  </script>
</body>
</html>
